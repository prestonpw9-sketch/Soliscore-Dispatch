
[functions.twilio-dispatcher]
enabled = true
verify_jwt = false
import_map = "./functions/twilio-dispatcher/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/twilio-dispatcher/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/twilio-dispatcher/*.html" ]

[functions.send-outbound-sms]
enabled = true
verify_jwt = true
import_map = "./functions/send-outbound-sms/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/send-outbound-sms/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/send-outbound-sms/*.html" ]

[functions.gemini-chat]
enabled = true
verify_jwt = false
import_map = "./functions/gemini-chat/deno.json"
entrypoint = "./functions/gemini-chat/index.ts"

# Inbound SMS from the business number. verify_jwt stays off so a superintendent
# can text without a Supabase login. Requests are authenticated with
# X-Twilio-Signature (see supabase/functions/_shared/twilioSignature.ts).
# Optional secret TWILIO_WEBHOOK_URL must match the Twilio console webhook URL.
[functions.super-processor]
enabled = true
verify_jwt = false
entrypoint = "./functions/super-processor/index.ts"

# Inbound voice, including Gather / press-1 / press-2 and recording callbacks.
# Same X-Twilio-Signature check and optional TWILIO_WEBHOOK_URL as super-processor.
[functions.twilio-voice]
enabled = true
verify_jwt = false
entrypoint = "./functions/twilio-voice/index.ts"

[functions.twilio-status]
enabled = true
verify_jwt = true
import_map = "./functions/twilio-status/deno.json"
entrypoint = "./functions/twilio-status/index.ts"

# Server-side job address geocoding (US Census, Nominatim fallback, Arizona bias).
# Called by the app with the signed-in user's JWT; the function also checks the
# user_roles row (owner / crew) itself.
[functions.geocode-job]
enabled = true
verify_jwt = true
entrypoint = "./functions/geocode-job/index.ts"

# Daily owner payroll SMS summary. Disabled by default: leave enabled = false
# until Preston wants it, then also tick "Send each evening" on the Payroll page
# and schedule a POST with the x-payroll-summary-secret header.
[functions.payroll-daily-summary]
enabled = false
verify_jwt = false
entrypoint = "./functions/payroll-daily-summary/index.ts"
